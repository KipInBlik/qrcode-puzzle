<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVEL 2</title>

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/level2.css">
</head>

<body>
    <div class="scanlines"></div>

    <main class="level2-container">
        <h2>// LEVEL 02</h2>

        <section class="game-panel">
            <div class="status-row">
                <span>STEP <span id="stepCounter">0</span></span>
                <span id="statusText">AWAITING INPUT</span>
            </div>

            <div
                id="grid"
                class="grid"
                aria-label="8 bij 8 wiskundige gridpuzzel"
            ></div>

            <div class="legend" aria-hidden="true">
                <span><i class="legend-dot start"></i> START</span>
                <span><i class="legend-dot player"></i> POSITION</span>
                <span><i class="legend-dot goal"></i> EXIT</span>
            </div>
        </section>

        <div class="controls">
            <button id="resetButton" class="cyber-button" type="button">
                RESET
            </button>
        </div>

        <section id="successPanel" class="success-panel" hidden>
            <div class="success-title">ACCESS GRANTED</div>
            <div class="success-text">GRID SOLVED.</div>
            <div class="success-steps">
                STEPS: <span id="successSteps">0</span>
            </div>
        </section>
    </main>

    <script src="assets/js/level2.js"></script>
</body>
</html>
